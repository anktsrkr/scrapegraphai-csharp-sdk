name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ScrapeGraphAI.slnx

      - name: Build
        run: dotnet build ScrapeGraphAI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ScrapeGraphAI.slnx --configuration Release --no-build
