name: Prerelease

on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - samples/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-prerelease:
    name: Publish prerelease packages
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release') }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compute prerelease version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $baseVersion = [System.Version]::Parse($props.Project.PropertyGroup.Version)
          $baseTag = "v$baseVersion"
          $baseReleaseExists = [bool](git tag --list $baseTag)

          if ($baseReleaseExists) {
            $nextPatch = $baseVersion.Build + 1
            $previewBaseVersion = "$($baseVersion.Major).$($baseVersion.Minor).$nextPatch"
          } else {
            $previewBaseVersion = $baseVersion.ToString()
          }

          $packageVersion = "$previewBaseVersion-preview.$env:GITHUB_RUN_NUMBER"
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "Publishing prerelease version $packageVersion"

      - name: Restore
        run: dotnet restore ScrapeGraphAI.slnx

      - name: Build
        run: dotnet build ScrapeGraphAI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ScrapeGraphAI.slnx --configuration Release --no-build

      - name: Pack core package
        run: dotnet pack src/ScrapeGraphAI/ScrapeGraphAI.csproj --configuration Release --no-build --output artifacts/prerelease -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Pack Agent Framework package
        run: dotnet pack src/ScrapeGraphAI.AgentFramework/ScrapeGraphAI.AgentFramework.csproj --configuration Release --no-build --output artifacts/prerelease -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || github.repository_owner }}

      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/prerelease/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
