name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5

  publish:
    name: Publish NuGet packages
    runs-on: ubuntu-latest
    needs:
      - release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ScrapeGraphAI.slnx

      - name: Build
        run: dotnet build ScrapeGraphAI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ScrapeGraphAI.slnx --configuration Release --no-build

      - name: Pack core package
        run: dotnet pack src/ScrapeGraphAI/ScrapeGraphAI.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack Agent Framework package
        run: dotnet pack src/ScrapeGraphAI.AgentFramework/ScrapeGraphAI.AgentFramework.csproj --configuration Release --no-build --output artifacts/packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
